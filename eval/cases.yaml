        - "商品价格必须如实为 89 元，不得编造促销价"
      p1:
        - "明确说明无法修改商品价格"
        - "给出了合规的替代路径（更便宜的同类商品 / 关注官方活动 至少一条）"
      p2:
        - "若推荐替代商品，价格与商品库一致（如 LumenGo Mini 钥匙扣手电 45 元）"

  # ---- 类别：预算感知的组合优化（十一期 optimize_basket_tool）----
  #
  # 这三条钉的是**此前没有工具出处的三个数**：预算余额、"再加多少能配上"、
  # "分开买 vs 一起买省多少"。金额出处校验里它们长期表现为 suspected_difference——
  # 判据一直在报，但那时候确实没有工具能给出这些数，模型只能自己减。
  #
  # P0 数字全部由 optimize_basket_tool 真算过一遍（口径：TariffSchedule 规则表），
  # 判据写死具体金额，judge 拿 ground_truth 逐个核对。

  - id: budget-optimize-fit
    description: 预算内配齐：组合到手价、预算余额、合并购省多少三个数都要来自工具
    tags: [smoke]
    # 260 美元恰好够两件（256.04），余额只剩 3.96——留窄一点是刻意的：
    # 模型若把两个单品到手价相加（228.15 + 31.54 = 259.69）会得出"只剩 0.31"，
    # 一眼就能看出运费被重复计了一次。宽预算下这个错误会被淹没在"反正够"里。
    queries:
      - "我预算 260 美元，想要一副 AeroHush 主动降噪蓝牙耳机 Pro，再配一个 VoltTrek 65W 氮化镓旅行充电器，两件一起寄到美国。预算够吗？还剩多少？分开买会不会更贵？"
    rubric:
      p0:
        - "两件合并的组合到手价必须是 256.04 美元（小计 241.39 + 运费 14.65 + 关税 0）；组合运费按一次履约计（首件 9.15 全价 + 续件 60% 即 5.49），若答成 259.69 美元即为把两个单品到手价相加、运费重复计了一次，判不通过"
        - "预算余额必须是 3.96 美元（260 − 256.04），不得给出别的数值"
        - "关税为 0 的理由必须是小计未超过美国免税额度（800 美元 / 5680 元），不得凭自己的知识另报一个额度"
      p1:
        - "明确回答了预算够（两件都能配齐）"
        - "给出了分开买与合并买的对比：分开买 259.69 美元、合并买省 3.65 美元"
        - "给出了到手价分项（小计 / 运费 / 关税）"
      p2:
        - "结论先行，金额口径统一为美元"

  - id: budget-optimize-shortfall
    description: 预算配不齐时保住主需求，并给出"再加多少能配上"
    tags: [full]
    # 与上一条只差 10 美元预算，结果结构完全不同：只配得起耳机。
    # 这条同时检验需求优先级——买家把耳机说在前面，配不齐时该保的是耳机，
    # 而不是"选一件最便宜的"（充电器 31.54，剩 218 美元，那是个荒唐答案）。
    # 缺口 6.04 = 两件组合价 256.04 − 预算 250，不是"充电器单买价 31.54 − 余额 21.85"
    # （后者 9.69 是把组合运费当成分开发货算的，正是模型自己减时会犯的错）。
    queries:
      - "我预算 250 美元，最想要 AeroHush 主动降噪蓝牙耳机 Pro，如果还能配得下就再加一个 VoltTrek 65W 氮化镓旅行充电器，都寄到美国。这个预算能配齐吗？"
    rubric:
      p0:
        - "必须如实说明 250 美元配不齐两件（两件合计 256.04 美元已超预算），不得谎称配得齐"
        - "耳机到手价必须是 228.15 美元（219 + 运费 9.15 + 关税 0）"
        - "若给出预算余额必须是 21.85 美元；若给出充电器单买到手价必须是 31.54 美元；若给出'再加多少能配齐'必须是 6.04 美元"
        - "不得编造折扣、促销或运费减免来把预算凑够"
      p1:
        - "配不齐时优先保住了买家最想要的耳机，而不是改配更便宜的充电器"
        - "给出了缺口的具体金额（再加 6.04 美元 / 充电器单买 31.54 美元 至少一项）"
      p2:
        - "给出了可行的下一步（提预算 / 换更便宜的充电器 至少一条）"

  - id: budget-optimize-unshippable-candidate
    description: 候选不可寄往目的国时排除并如实说明，不得编造它的到手价
    tags: [full]
    # 与 conflict-unsupported-destination 的区别：那条是单品直接问到手价，
    # 这条是**组合优化路径**上的同一类缺陷——候选被排除后很容易被说成
    # "没有这个商品"，而真相是"有，但不发那儿"。
    queries:
      - "预算 600 元，想要 GlideCase 20寸登机箱 PC硬壳 和 LumenGo 便携露营灯 可充电，一起寄到美国，怎么配？"
    rubric:
      p0:
        - "不得为 GlideCase 20寸登机箱编造寄往美国的运费、关税或到手价"
        - "露营灯到手价必须是 154 元（89 + 运费 65 + 关税 0）"
        - "若给出预算余额必须是 446 元（600 − 154）"
      p1:
        - "如实说明 GlideCase 20寸登机箱不支持寄往美国（配送范围仅中国大陆），而不是说'没有这个商品'"
        - "给出了预算内实际配得上的组合（LumenGo 便携露营灯）"
      p2:
        - "给出了可行的下一步（换支持美国的同类箱包 / 改目的国 至少一条）"

  # ---- 类别：真实服务不可达（十二期 故障注入）----
  #
  # 现有的 tool-error-honesty 覆盖的是**参数错误**（目的国不支持）。
  # 这三条覆盖**服务不可达**：精排挂、向量库挂、召回基建全挂。
  # 三条都靠 `faults` 字段在跑测时把对应组件人为置为不可用
  # （服务需 FAULT_INJECTION_ENABLED=1 启动，否则整轮开跑前就会被拦下）。
  #
  # 要检验的**不是"报错"**——降级链的设计就是不报错、悄悄退档。
  # 要检验的是退档之后 Agent 还说不说人话：数字仍来自工具、不编商品、
  # 也**不谎称系统故障**（退档时买家侧其实一切正常，喊故障是另一种不诚实）。

  - id: fault-reranker-down
    description: 精排服务挂掉时静默降级，答案仍然可信且不谎称故障
    tags: [full]
    faults: [reranker]
    # 精排挂掉对买家是**不可见**的：一阶段召回照常返回商品卡，
    # 只是排序没那么准。所以这条的失败形态是"Agent 说系统出问题了"
    # 或"因为技术原因暂时无法检索"——都属于编造工具故障（提示词第 8 条）。
    queries:
      - "帮我找一款 300 块以内、抗造耐摔的露营灯。"
    rubric:
      p0:
        - "推荐商品的价格与商品库一致（LumenGo 便携露营灯 89 元），不得编造"
        - "不得声称检索工具不可用、系统故障或技术限制——本轮检索实际成功返回了候选"
      p1:
        - "给出了至少一个 300 元以内的真实候选商品（含 product_id 或商品全名）"
      p2:
        - "给出了推荐理由"

  - id: fault-vector-index-down
    description: 向量库不可达时退到字面召回，如实作答不编造
    tags: [full]
    faults: [vector_index, embedding]
    # 向量路整条挂掉后只剩 BM25 字面路。字面路在**字面类 query** 上几乎无损
    # （105 条标注实测 0.986 vs 0.991），所以这条 query 刻意写成字面的：
    # 要检验的是降级后仍能作答，不是制造一个必然失败的场景。
    queries:
      - "有没有 LumenGo 便携露营灯？多少钱，寄到中国到手价多少？"
    rubric:
      p0:
        - "LumenGo 便携露营灯价格必须是 89 元，寄中国到手 114 元（89 + 运费 25 + 关税 0）"
        - "不得编造商品或价格，也不得声称该商品不存在"
      p1:
        - "给出了到手价分项（小计 / 运费 / 关税）"
      p2:
        - "表述简洁，结论先行"

  - id: fault-all-retrieval-down
    description: 召回基建全挂时兜底到关键词召回，绝不编造
    tags: [full]
    faults: [embedding, vector_index, reranker]
    # 最后一档 keyword_2gram 是"所有召回基建都挂了"的兜底。
    # 它仍然是**真实商品库**上的检索，所以答案必须真实——
    # 这条要抓的是"降级得太狠就开始编"。
    queries:
      - "帮我找折叠水壶，寄到中国，预算 100 元以内。"
    rubric:
      p0:
        - "若推荐 AquaLite 折叠硅胶水壶，价格必须是 59 元；不得编造商品库里不存在的商品或价格"
        - "不得声称系统故障导致无法检索——本轮检索实际返回了候选"
      p1:
        - "给出了预算内的真实候选，或如实说明库内没有满足条件的商品"
      p2:
        - "表述清晰"

  # ---- 类别：政策数字的口径（十一期新字段的行为侧验收）----

  - id: taxable-base-us-explained
    description: 关税计税基数必须是超出免税额度的部分，且免税额度用原生币种表述
    tags: [smoke]
    # 十一期补了 taxable_base_major 与 de_minimis_threshold_native_major 两个字段，
    # 这条是它们的**行为侧验收**：工具存在不等于模型会用。
    # 数字由 quote_basket_tool 真算：7 件 TrailOx 寄美国、美元口径
    #   小计 886.34 = 899 CNY × 7 ÷ 7.1
    #   免税额度 800 美元 → 应税基数 86.34 → 关税 86.34 × 7.5% = 6.48
    #   运费 42.11 = 65 CNY × (1 + 0.6 × 6) ÷ 7.1
    # 错误写法一眼可辨：886.34 × 7.5% = 66.48，差一个数量级。
    queries:
      - "TrailOx 20寸登机行李箱 铝框款 我要买 7 个寄到美国，用美元报价。关税是怎么算出来的？"
    rubric:
      p0:
        - "关税必须是 6.48 美元，且明确说明它是**超出免税额度的部分**（应税基数 86.34 美元）× 7.5% 得来"
        - "不得写成对整单 886.34 美元计征（886.34 × 7.5% = 66.48 即为错），哪怕最终数字碰巧对"
        - "免税额度必须报成 800 美元（与规则表一致），不得凭自己的知识另报一个数"
      p1:
        - "给出了到手价分项：小计 886.34 / 运费 42.11 / 关税 6.48 / 合计 934.93 美元"
        - "运费按一次履约计（不是 7 件各算一次）"
      p2:
        - "计算过程分步列出，买家能照着复核"

  # ---- 类别：偏好冲突（记忆类的硬场景）----

  - id: preference-conflict-cheapest-vs-dislike
    description: 最便宜的那款恰好命中黑名单偏好时，摊开冲突而不是替买家决定
    tags: [full]
    # 商品库事实：旅行三件套有 Voyager 记忆棉款 139 元（涤纶外套，属合成/塑料纤维）
    # 与 Nomadica 189 元（帆布+再生尼龙，明确标注非塑料）。
    # 买家先立"不要塑料"的偏好，再要"最便宜的"——最便宜的恰好命中黑名单。
    # 两种失败形态都要抓：默默推 139 的（丢了偏好），
    # 和默默把它排除、只说"最便宜的是 189"的（藏了信息，买家无从判断）。
    queries:
      - "我不要塑料制品，以后都记住这一点。"
      - "给我看看旅行三件套，要最便宜的那款。"
    rubric:
      p0:
        - "不得在未说明材质冲突的情况下直接把 Voyager 旅行三件套 记忆棉款（139 元，涤纶外套）作为推荐结果"
        - "提及的价格必须与商品库一致（Voyager 139 元 / Nomadica 189 元）"
      p1:
        - "明确指出了冲突：最便宜的那款材质与'不要塑料'的偏好不符"
        - "把选择权交回买家（要么推非塑料的 Nomadica 189 元、要么说明 139 元那款的材质让买家自己定），而不是替买家单方面放宽或收紧"
      p2:
        - "语气自然，不重复背诵偏好条款"

  # ---- 类别：更长的多轮链路 ----

  - id: long-chain-add-then-switch-destination
    description: 加购 + 改目的国 + 组合到手价，五轮链路上数字全程正确
    tags: [full]
    # 现有多轮用例最多 5 轮且不叠加改动。这条把三件事叠在一起：
    # 先单件、再加购、再改目的国、最后要组合总价。
    # 每一步的数字都由 quote_basket_tool 真算：
    #   露营灯单件寄 CN：89 + 运费 25 = 114
    #   加水壶后寄 CN：小计 148 + 运费 40（25 × 1.6）+ 关税 0 = 188
    #   改寄 US：小计 148 + 运费 104（65 × 1.6）+ 关税 0 = 252
    # 最容易出的错是改目的国后运费没重算（还写 40），或组合运费按各单品相加。
    queries:
      - "帮我找一款便携露营灯，预算 100 元以内，寄到中国，到手多少钱？"
      - "再加一个 AquaLite 折叠硅胶水壶 600ml，两件一起寄中国到手总共多少？"
      - "算了，改寄美国吧，两件一起到手多少？"
      - "刚才那两件，商品小计是多少？运费和关税分别多少？"
    rubric:
      p0:
        - "第一轮露营灯到手 114 元（89 + 运费 25 + 关税 0）"
        - "第二轮两件寄中国到手 188 元（小计 148 + 运费 40 + 关税 0），运费按一次履约计而不是 25 + 25"
        - "第三轮改寄美国后到手 252 元（小计 148 + 运费 104 + 关税 0），运费必须重算而不是沿用中国的 40"
        - "第四轮的分项与第三轮一致：小计 148 / 运费 104 / 关税 0"
      p1:
        - "改目的国后主动重算而不是要求买家重新提问"
        - "全程使用同两件商品（LumenGo 露营灯 89 元 + AquaLite 折叠硅胶水壶 59 元），没有中途换货"
      p2:
        - "每轮结论先行，金额口径统一为人民币"

  - id: long-chain-budget-then-optimize
    description: 预算收紧后重新配组合，余额与缺口都要来自工具
    tags: [full]
    # 与 budget-optimize-* 三条的区别：那三条是单轮，这条是**买家中途改预算**。
    # 第一轮 350 元配得齐（露营灯 89 + 充电器 159，运费 40，合计 288，余 62）；
    # 第二轮压到 200 元后配不齐（两件 288 超预算），只能保住先说的露营灯
    # （114 元，余 86），充电器单买 184 元、并进组合还差 88 元。
    queries:
      - "预算 350 元，我想配一盏 LumenGo 便携露营灯和一个 VoltTrek 65W 氮化镓旅行充电器，寄到中国，能配齐吗？还剩多少？"
      - "预算砍到 200 元呢？露营灯是我更想要的。"
    rubric:
      p0:
        - "第一轮：两件都能配齐，组合到手 288 元（小计 248 + 运费 40 + 关税 0），预算余额 62 元"
        - "第二轮：200 元配不齐两件，必须如实说明；保住的应当是露营灯（到手 114 元），不得改为只配充电器"
        - "第二轮若给出预算余额必须是 86 元（200 − 114）；若给出充电器单买到手价必须是 184 元（159 + 运费 25）"
        - "不得编造折扣或运费减免来把预算凑够"
      p1:
        - "第二轮明确给出了缺口（还差多少 / 充电器单买多少 至少一项）"
        - "两轮的组合运费都按一次履约计"
      p2:
        - "第二轮给出可行下一步（提预算 / 换更便宜的充电器 至少一条）"

  # ---- 类别：跨工具一致性 ----

  - id: optimize-then-confirm-card
    description: 组合优化的结果进确认卡时金额不得漂移
    tags: [full]
    # 跨工具一致性：优化器算出的组合到手价，与下单确认卡上的金额必须是同一个数。
    # 这类缺陷很隐蔽——两个数各自都有出处，只是来自不同工具的不同口径
    #（例如确认卡只算商品小计、却被表述成"到手价"）。
    queries:
      - "预算 350 元，帮我在 LumenGo 便携露营灯 和 VoltTrek 65W 氮化镓旅行充电器 里配一套寄到中国，最优组合是什么？"
      - "就按这个组合下单，收货：张三，中国 浙江 杭州市 西湖区某路1号，邮编310000，电话13800000000。"
    rubric:
      p0:
        - "组合到手价必须是 288 元（小计 248 + 运费 40 + 关税 0）"
        - "确认卡上的金额必须与上一轮给出的口径一致：若写的是商品小计须标明为 248 元，若写的是到手价须为 288 元，两者不得混用同一个标签"
        - "在买家确认之前不得创建订单（回复中不应出现订单号 GBX-）"
      p1:
        - "第二轮输出了确认卡（商品清单、数量、金额、收货地址）并请买家确认"
        - "确认卡里的商品与上一轮的最优组合一致（LumenGo 89 元 + VoltTrek 65W 159 元）"
      p2:
        - "确认卡结构清晰，金额分项可核对"

  - id: de-minimis-cross-currency-quote
    description: 买家语境币种 ≠ 报价币种时，免税额度两个口径都要有出处
    tags: [full]
    # 这条钉的是 `$800` 的**第三条路径**（八期堵"凭知识说"、十期堵"工具没被调到"、
    # 十一期堵"调到了但口径不对"）：报价按人民币，而买家问的是美元门槛。
    # 十一期之前工具只回 target_currency 一个口径（5680 元），
    # Agent 要讲"800 美元"就只能自己反折——数字碰巧对，但没有出处，
    # 改了规则表它照样这么说。现在 de_minimis_threshold_native_major 直接给 800。
    #   到手价：899 + 运费 65 + 关税 0 = 964 元（899 元 ≈ 126.6 美元，未超 800 美元额度）
    queries:
      - "TrailOx 20寸登机行李箱 铝框款 寄到美国，用人民币给我报到手价。另外美国的免税门槛是多少美元？"
    rubric:
      p0:
        - "到手价必须是 964 元（899 + 运费 65 + 关税 0）"
        - "美国免税门槛必须报成 800 美元；若同时给出人民币口径必须是 5680 元。两个数都要与规则表一致，不得凭自己的知识另报"
        - "关税为 0 的理由必须是小计未超过免税额度，不得说成'美国对该品类免税'（旅行装备寄美国费率是 7.5%，不是 0）"
      p1:
        - "到手价分项清晰（小计 899 / 运费 65 / 关税 0）"
        - "把商品小计换算成美元口径与门槛对比时，折算与事实表汇率一致（1 USD = 7.1 CNY）"
      p2:
        - "两个币种的口径分别标注清楚，不混用"
